<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>OPERATION BLACKOUT — UI TEST BED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      font-family: 'Barlow', system-ui, sans-serif;
      color: #e8eef7;
      -webkit-font-smoothing: antialiased;
    }

    #app { position: fixed; inset: 0; }

    canvas#viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: none;
    }

    #ui-root {
      position: absolute;
      inset: 0;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
  </style>
</head>

<body>
  <div id="app">
    <canvas id="viewport"></canvas>
    <div id="ui-root"></div>
  </div>
  <script type="module" src="./preview.ts"></script>
</body>

</html>
